# Portfolio production runtime. Replaces `serve -s dist`, which cannot host a
# nested static app (it rewrites every non-file path to the SPA shell, so a
# prototype under /prototypes/ gets hijacked by the portfolio index.html).
worker_processes auto;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    types_hash_max_size 2048;

    server {
        listen       3000;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html;

        # Behind DO's proxy the public port is 443, but nginx listens on 3000.
        # Without these, a directory 301 (e.g. /prototypes/x/quote -> quote/)
        # emits an absolute Location with :3000, which is dead publicly. Emit
        # host-relative redirects and let the browser keep scheme+host.
        absolute_redirect off;
        port_in_redirect  off;

        # Nested static apps (clickable prototypes). Serve real files only —
        # NO fallback to the portfolio SPA. $uri.html covers Next.js export
        # pages; =404 keeps a missing prototype path from leaking the SPA.
        location /prototypes/ {
            try_files $uri $uri/ $uri.html =404;
        }

        # Portfolio SPA: real file if present (assets, robots.txt, sitemap.xml,
        # /cv/cv.pdf), else the app shell for client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
